<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test2</title></head><body>
<div id="r" style="font-size:20px;padding:20px">Probando...</div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbx-14QKrkUgOBeanPdsDp-3_PVlmJYMVyinJvR7lzJGpm0wa8ATBRmHmctj-JHbhOj7/exec';
var S = { user:null, token:null };
async function api(action, data){
  data = data||{};
  try{
    var r = await fetch(API_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:S.token}, data))});
    var j = await r.json();
    return 'OK: '+JSON.stringify(j).slice(0,100);
  }catch(e){ return 'FALLO: '+e.message; }
}
var t0 = Date.now();
api('tasa_get', {}).then(function(res){
  document.getElementById('r').textContent = res + ' ('+((Date.now()-t0)/1000)+'s)';
});
setTimeout(function(){
  var el = document.getElementById('r');
  if(el.textContent === 'Probando...') el.textContent = 'COLGADO: sin respuesta en 25s';
}, 25000);
</script>
</body></html>
